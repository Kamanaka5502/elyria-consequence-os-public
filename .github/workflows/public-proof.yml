name: public-proof

on:
  push:
  pull_request:

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - run: python -m elyria_public_demo.proof_pack
      - run: python -m elyria_public_demo.cli --demo-valid
      - run: python -m elyria_public_demo.cli --demo-invalid
