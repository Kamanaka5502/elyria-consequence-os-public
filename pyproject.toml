[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elyria-consequence-os-public"
version = "0.1.0"
description = "Bounded public proof surface for governed consequence admission."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Samantha Revita" },
  { name = "Terry Snyder" }
]
license = { text = "Proprietary Evaluation License" }

[project.scripts]
elyria-public-demo = "elyria_public_demo.cli:main"

[tool.setuptools.packages.find]
include = ["elyria_public_demo*"]
